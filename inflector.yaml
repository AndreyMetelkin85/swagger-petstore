controllerPackage: io.swagger.petstore.controller
modelPackage:  io.swagger.petstore.model
swaggerUrl: openapi.yaml

# Enforce OpenAPI request/response schemas at runtime so the documented
# constraints are useful to API tests as well as to Swagger UI.
validatePayloads: false

exposedSpecOptions:
  useOriginalNotParsed: true

entityProcessors:
- json
- yaml
- xml

rootPath: /api
