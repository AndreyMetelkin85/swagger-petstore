<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Новый пароль · Petstore</title>
<style>body{margin:0;background:#f3f7f6;color:#223734;font:16px Arial,sans-serif}main{max-width:420px;margin:8vh auto;padding:32px;background:white;border-radius:16px}h1{font-size:26px}label{display:block;margin:20px 0 8px}input{box-sizing:border-box;width:100%;padding:12px;border:1px solid #ccd9d5;border-radius:8px}button{margin-top:24px;border:0;background:#087f7b;color:white;padding:14px 20px;border-radius:8px;font-size:16px;cursor:pointer}#status{line-height:1.6}a{color:#087f7b}</style></head>
<body><main><p>Petstore · Восстановление доступа</p><h1>Новый пароль</h1><form id="form"><label for="password">Новый пароль</label><input id="password" type="password" autocomplete="new-password" minlength="6" maxlength="100" required><label for="repeat">Повторите пароль</label><input id="repeat" type="password" autocomplete="new-password" required><button id="submit">Сохранить пароль</button></form><p id="status" role="status"></p></main>
<script>
const code = new URLSearchParams(location.search).get('code');
history.replaceState(null, '', location.pathname);
const form = document.getElementById('form'), status = document.getElementById('status'), button = document.getElementById('submit');
if (!code) { form.hidden = true; status.textContent = 'Ссылка недействительна. Запросите новое письмо для восстановления пароля.'; }
form.addEventListener('submit', async (event) => {
  event.preventDefault(); const password = document.getElementById('password').value;
  if (password !== document.getElementById('repeat').value) { status.textContent = 'Пароли не совпадают.'; return; }
  button.disabled = true; status.textContent = 'Сохраняем пароль…';
  try {
    const response = await fetch('/api/v3/auth/password/reset?code=' + encodeURIComponent(code), {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({newPassword:password})});
    if (response.status === 204) { form.hidden = true; document.getElementById('password').value = ''; document.getElementById('repeat').value = ''; status.textContent = 'Пароль обновлён. Теперь можно войти в магазин с новым паролем.'; }
    else { const data = await response.json(); const messages = {INVALID_RESET_LINK:'Ссылка недействительна. Запросите новую.',RESET_LINK_EXPIRED:'Срок действия ссылки истёк. Запросите новую.',RESET_LINK_ALREADY_USED:'Ссылка уже использована. Войдите с новым паролем.',VALIDATION_ERROR:'Проверьте пароль: от 6 до 100 символов и не более 72 байт UTF-8.'}; status.textContent = messages[data.error] || 'Не удалось изменить пароль. Попробуйте ещё раз.'; }
  } catch { status.textContent = 'Не удалось подключиться к серверу. Попробуйте ещё раз.'; }
  finally { button.disabled = false; }
});
</script></body></html>
