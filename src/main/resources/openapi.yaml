              expiryMonth: 12
              expiryYear: 2099
              cvv: '123'
              cardholderName: IVAN IVANOV
      responses:
        '201':
          description: Оплата успешно выполнена.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '200':
          description: Возвращён результат ранее выполненного запроса с тем же Idempotency-Key.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Payment'}
        '400':
          description: Идентификатор, заголовок или тело запроса имеют неверный формат.
          content:
