openapi: 3.0.4
info:
  title: Swagger Petstore API
  version: 2.0.0
  description: |-
    An API for a pet store where users can create an account, browse pets, and place orders.
    It is designed for practicing manual and automated testing with realistic success and error scenarios.
  contact:
    name: Training project
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080/api/v3
    description: Local development server
tags:
  - name: Health
    description: Service availability.
  - name: Registration
    description: Account registration and confirmation.
  - name: Authentication
    description: Sign-in and password recovery.
  - name: Pets
    description: Pet catalog operations.
  - name: Orders
    description: Order operations.
  - name: Users
    description: User profile operations.
  - name: Administration
    description: Administrative account operations.

paths:
  /health:
    get:
      tags: [Health]
      summary: Проверка состояния сервиса
      description: Возвращает текущее состояние сервиса.
      operationId: health
      x-swagger-router-controller: HealthController
      security: []
      responses:
        '200':
          description: API и PostgreSQL готовы принимать запросы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
                service: swagger-petstore
                database: UP
                timestamp: '2026-09-05T09:15:30.000Z'
        '503':
          description: API запущен, но PostgreSQL недоступен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: DOWN
                service: swagger-petstore
                database: DOWN
                timestamp: '2026-09-05T09:15:30.000Z'
        '500':
          description: Не удалось определить состояние сервиса.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                healthCheckFailed:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /auth/register:
    post:
      tags: [Registration]
      summary: Регистрация пользователя
      description: |-
        Создаёт учётную запись со статусом `PENDING` и возвращает ссылку подтверждения.
        Новому пользователю назначается роль `USER`.
      operationId: register
      x-swagger-router-controller: RegistrationController
      security: []
      requestBody:
        required: true
        description: Учётные данные и поля профиля нового пользователя.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              qaEngineer:
                summary: Корректные данные регистрации
                value:
                  username: qa_engineer
                  password: SecurePass123
                  email: qa.engineer@example.com
                  firstName: Alex
                  lastName: Smith
                  phone: '+1-555-0110'
              invalid:
                summary: Данные, приводящие к ответу 422
                value:
                  username: qa
                  password: '123'
                  email: not-an-email
      responses:
        '201':
          description: Учётная запись со статусом PENDING создана; возвращена ссылка подтверждения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
              example:
                user:
                  id: b9ec3485-6954-4faf-813b-1c9d25ea750c
                  username: qa_engineer
                  email: qa.engineer@example.com
                  firstName: Alex
                  lastName: Smith
                  phone: '+1-555-0110'
                  userStatus: PENDING
                  role: USER
                confirmationUrl: http://localhost:8080/api/v3/auth/confirm/b9ec3485-6954-4faf-813b-1c9d25ea750c?code=example
                expiresAt: '2026-09-06T12:00:00Z'
        '400':
          description: Тело запроса отсутствует или содержит некорректные данные.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingBody:
                  value: {status: 400, error: BAD_REQUEST, message: Request body is required, details: []}
                malformedJson:
                  value: {status: 400, error: BAD_REQUEST, message: Request body contains malformed or incompatible JSON, details: []}
        '409':
          description: Имя пользователя или email уже зарегистрированы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userAlreadyExists:
                  value: {status: 409, error: USER_ALREADY_EXISTS, message: A user with this username or email already exists, details: []}
        '422':
          description: Поля регистрации не прошли валидацию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRegistration:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: email, message: Email must be a valid email address}
        '500':
          description: Не удалось создать пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /auth/confirm/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Registration]
      summary: Подтверждение регистрации
      description: Подтверждает регистрацию по одноразовой ссылке, действующей 24 часа.
      operationId: confirm
      x-swagger-router-controller: RegistrationController
      security: []
      parameters:
        - $ref: '#/components/parameters/OneTimeCode'
      responses:
        '200':
          description: Регистрация подтверждена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: UUID или одноразовый код имеют неверный формат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidUserId:
                  value: {status: 400, error: BAD_REQUEST, message: User id must be a valid UUID, details: []}
                invalidConfirmationLink:
                  value: {status: 400, error: INVALID_CONFIRMATION_LINK, message: The one-time link is invalid, details: []}
        '404':
          description: Пользователь из ссылки не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  value: {status: 404, error: USER_NOT_FOUND, message: User was not found, details: []}
        '409':
          description: Регистрация уже подтверждена или состояние ссылки изменилось.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyConfirmed:
                  value: {status: 409, error: ACCOUNT_ALREADY_CONFIRMED, message: The account has already been confirmed, details: []}
                stateChanged:
                  value: {status: 409, error: CONFIRMATION_STATE_CHANGED, message: The confirmation state changed; request a new link, details: []}
        '410':
          description: Срок действия ссылки подтверждения истёк.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                confirmationExpired:
                  value: {status: 410, error: CONFIRMATION_LINK_EXPIRED, message: The one-time link has expired, details: []}
        '500':
          description: Не удалось подтвердить регистрацию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /auth/confirmation/resend:
    post:
      tags: [Registration]
      summary: Повторная отправка ссылки подтверждения
      operationId: resendConfirmation
      x-swagger-router-controller: RegistrationController
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Старая ссылка аннулирована, создана новая.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationLinkResponse'
        '400':
          description: Тело запроса отсутствует или содержит некорректные данные.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingBody:
                  value: {status: 400, error: BAD_REQUEST, message: Request body is required, details: []}
                malformedJson:
                  value: {status: 400, error: BAD_REQUEST, message: Request body contains malformed or incompatible JSON, details: []}
        '401':
          description: Имя пользователя или пароль указаны неверно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  value: {status: 401, error: INVALID_CREDENTIALS, message: Username or password is incorrect, details: []}
        '409':
          description: Учётная запись уже подтверждена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyConfirmed:
                  value: {status: 409, error: ACCOUNT_ALREADY_CONFIRMED, message: The account has already been confirmed, details: []}
        '422':
          description: Логин или пароль не переданы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingCredentials:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: username, message: Username is required}
        '500':
          description: Не удалось создать новую ссылку подтверждения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /auth/password/forgot:
    post:
      tags: [Authentication]
      summary: Запрос восстановления пароля
      operationId: forgotPassword
      x-swagger-router-controller: AuthenticationController
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
      responses:
        '200':
          description: Создана одноразовая ссылка, действующая 30 минут.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetLinkResponse'
        '400':
          description: Тело запроса отсутствует или содержит некорректные данные.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingBody:
                  value: {status: 400, error: BAD_REQUEST, message: Request body is required, details: []}
                malformedJson:
                  value: {status: 400, error: BAD_REQUEST, message: Request body contains malformed or incompatible JSON, details: []}
        '404':
          description: Пользователь с указанным email не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  value: {status: 404, error: USER_NOT_FOUND, message: A user with this email was not found, details: []}
        '422':
          description: Email не передан или имеет неверный формат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidEmail:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: email, message: Email must be a valid email address}
        '500':
          description: Не удалось создать ссылку восстановления.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /auth/password/reset/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Authentication]
      summary: Установка нового пароля
      operationId: resetPassword
      x-swagger-router-controller: AuthenticationController
      security: []
      parameters:
        - $ref: '#/components/parameters/OneTimeCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Пароль изменён, ранее выданные JWT отозваны.
        '400':
          description: UUID, одноразовый код или тело запроса имеют неверный формат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidUserId:
                  value: {status: 400, error: BAD_REQUEST, message: User id must be a valid UUID, details: []}
                missingBody:
                  value: {status: 400, error: BAD_REQUEST, message: Request body is required, details: []}
                malformedJson:
                  value: {status: 400, error: BAD_REQUEST, message: Request body contains malformed or incompatible JSON, details: []}
                invalidResetLink:
                  value: {status: 400, error: INVALID_RESET_LINK, message: The one-time link is invalid, details: []}
        '404':
          description: Пользователь из ссылки не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  value: {status: 404, error: USER_NOT_FOUND, message: User was not found, details: []}
        '409':
          description: Ссылка уже использована или её состояние изменилось.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                linkAlreadyUsed:
                  value: {status: 409, error: RESET_LINK_ALREADY_USED, message: The password reset link has already been used, details: []}
                stateChanged:
                  value: {status: 409, error: RESET_STATE_CHANGED, message: The password reset state changed; request a new link, details: []}
        '410':
          description: Срок действия ссылки восстановления истёк.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                resetExpired:
                  value: {status: 410, error: RESET_LINK_EXPIRED, message: The one-time link has expired, details: []}
        '422':
          description: Новый пароль не прошёл валидацию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPassword:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: newPassword, message: Password must be between 6 and 100 characters}
        '500':
          description: Не удалось изменить пароль.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /auth/login:
    post:
      tags: [Authentication]
      summary: Авторизация пользователя
      description: |-
        Проверяет локальные учётные данные и возвращает HS256 JWT сроком на один час.
        Передавайте Bearer token в заголовке `Authorization: Bearer <access_token>`.
      operationId: login
      x-swagger-router-controller: AuthenticationController
      security: []
      requestBody:
        required: true
        description: Имя пользователя и пароль.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              user:
                summary: Пользователь
                value:
                  username: qa_user
                  password: SecurePass123
              admin:
                summary: Администратор
                value:
                  username: admin
                  password: admin123
      responses:
        '200':
          description: Аутентификация выполнена успешно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                token_type: Bearer
                expires_in: 3600
                user:
                  id: b9ec3485-6954-4faf-813b-1c9d25ea750c
                  username: qa_user
                  email: qa.user@example.com
                  firstName: Alex
                  lastName: Smith
                  phone: '+1-555-0101'
                  userStatus: ACTIVE
                  role: USER
        '400':
          description: Тело запроса отсутствует или содержит некорректные данные.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingBody:
                  value: {status: 400, error: BAD_REQUEST, message: Request body is required, details: []}
                malformedJson:
                  value: {status: 400, error: BAD_REQUEST, message: Request body contains malformed or incompatible JSON, details: []}
        '401':
          description: Имя пользователя или пароль указаны неверно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  value: {status: 401, error: INVALID_CREDENTIALS, message: Username or password is incorrect, details: []}
        '403':
          description: Состояние учётной записи запрещает авторизацию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notVerified:
                  value: {status: 403, error: ACCOUNT_NOT_VERIFIED, message: The account has not been confirmed, details: []}
                blocked:
                  value: {status: 403, error: ACCOUNT_BLOCKED, message: The account is blocked, details: []}
        '422':
          description: Имя пользователя или пароль не переданы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingCredentials:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: password, message: Password is required}
        '500':
          description: Не удалось выполнить авторизацию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /pet:
    post:
      tags: [Pets]
      summary: Добавление питомца
      description: Создаёт запись в каталоге. Операция доступна только пользователю с ролью ADMIN.
      operationId: addPet
      x-swagger-router-controller: PetController
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Данные нового питомца. Если `id` не передан, сервер создаст его автоматически.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
            examples:
              dog:
                value:
                  name: Luna
                  category:
                    id: 0e446653-3b7b-4ad1-81d3-b0a71af26f31
                    name: Dogs
                  photoUrls:
                    - https://example.com/pets/luna.jpg
                  tags:
                    - id: f0c2308f-19f2-4689-a395-7926a5825cd0
                      name: friendly
                  status: available
      responses:
        '201':
          description: Питомец создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Тело запроса отсутствует или содержит некорректные данные.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingBody:
                  value: {status: 400, error: BAD_REQUEST, message: Request body is required, details: []}
                malformedJson:
                  value: {status: 400, error: BAD_REQUEST, message: Request body contains malformed or incompatible JSON, details: []}
        '401':
          description: Bearer token отсутствует или недействителен.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingToken:
                  value: {status: 401, error: UNAUTHORIZED, message: Bearer token is required, details: []}
                invalidToken:
                  value: {status: 401, error: INVALID_TOKEN, message: Access token is invalid, details: []}
                expiredToken:
                  value: {status: 401, error: TOKEN_EXPIRED, message: Access token has expired, details: []}
        '403':
          description: У пользователя нет роли ADMIN.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                roleForbidden:
                  value: {status: 403, error: FORBIDDEN, message: The current role is not allowed to perform this operation, details: []}
                accountBlocked:
                  value: {status: 403, error: ACCOUNT_BLOCKED, message: The account is blocked, details: []}
        '409':
          description: Питомец с указанным UUID уже существует.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                petAlreadyExists:
                  value: {status: 409, error: PET_ALREADY_EXISTS, message: A pet with this id already exists, details: []}
        '422':
          description: Поля питомца не прошли валидацию.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                invalidPet:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: name, message: Pet name is required}
        '500':
          description: Не удалось создать питомца.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}
    put:
      tags: [Pets]
      summary: Обновление питомца
      description: Заменяет данные питомца с указанным в теле `id`. Доступно администратору.
      operationId: updatePet
      x-swagger-router-controller: PetController
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Полное новое представление питомца с UUID.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
            example:
              id: 7c1d1b70-f31e-42cd-9f78-6a5d87ed8620
              name: Dog 1 Updated
              category:
                id: 0e446653-3b7b-4ad1-81d3-b0a71af26f31
                name: Dogs
              photoUrls: []
              tags: []
              status: pending
      responses:
        '200':
          description: Данные питомца обновлены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Тело запроса отсутствует или содержит некорректные данные.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingBody:
                  value: {status: 400, error: BAD_REQUEST, message: Request body is required, details: []}
                malformedJson:
                  value: {status: 400, error: BAD_REQUEST, message: Request body contains malformed or incompatible JSON, details: []}
        '401':
          description: Bearer token отсутствует или недействителен.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingToken:
                  value: {status: 401, error: UNAUTHORIZED, message: Bearer token is required, details: []}
                invalidToken:
                  value: {status: 401, error: INVALID_TOKEN, message: Access token is invalid, details: []}
                expiredToken:
                  value: {status: 401, error: TOKEN_EXPIRED, message: Access token has expired, details: []}
        '403':
