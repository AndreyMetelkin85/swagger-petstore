components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Bearer token из POST /auth/login. Передавайте его в заголовке Authorization: Bearer <access_token>.'

  parameters:
    PetId:
      name: petId
      in: path
      required: true
      description: UUID питомца.
      schema:
        type: string
        format: uuid
      example: 7c1d1b70-f31e-42cd-9f78-6a5d87ed8620
    OrderId:
      name: orderId
      in: path
      required: true
      description: UUID заказа.
      schema:
        type: string
        format: uuid
      example: e3a724f6-580d-4d87-91c4-8f17e2027629
    Username:
      name: username
      in: path
      required: true
      description: Имя пользователя с учётом регистра.
      schema:
        type: string
        minLength: 3
        maxLength: 30
        pattern: '^[A-Za-z0-9_.-]+$'
      example: qa_user
    UserId:
      name: userId
      in: path
      required: true
      description: UUID пользователя.
      schema:
        type: string
        format: uuid
      example: b9ec3485-6954-4faf-813b-1c9d25ea750c
    OneTimeCode:
      name: code
      in: query
      required: true
      description: Одноразовый секрет из confirmationUrl или resetUrl.
      schema:
        type: string
        minLength: 32
        maxLength: 128

  schemas:
    Role:
      type: string
      description: Роль авторизации, назначенная пользователю.
      enum: [USER, ADMIN]
      example: USER

    AccountStatus:
      type: string
      description: Состояние учётной записи пользователя.
      enum: [PENDING, ACTIVE, BLOCKED]
      example: ACTIVE

    RegisterRequest:
      x-swagger-router-model: io.swagger.petstore.model.RegisterRequest
      type: object
      additionalProperties: false
      required: [username, password, email]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9_.-]+$'
          example: qa_engineer
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          writeOnly: true
          example: SecurePass123
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          example: qa.engineer@example.com
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
          example: Alex
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
          example: Smith
        phone:
          type: string
          minLength: 7
          maxLength: 30
          pattern: '^\+?[0-9 ()-]+$'
          nullable: true
          example: '+1-555-0110'

    RegistrationResponse:
      x-swagger-router-model: io.swagger.petstore.model.RegistrationResponse
      type: object
      additionalProperties: false
      required: [user, confirmationUrl, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        confirmationUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    ConfirmationLinkResponse:
      x-swagger-router-model: io.swagger.petstore.model.ConfirmationLinkResponse
      type: object
      additionalProperties: false
      required: [confirmationUrl, expiresAt]
      properties:
        confirmationUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    PasswordForgotRequest:
      x-swagger-router-model: io.swagger.petstore.model.PasswordForgotRequest
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254

    PasswordResetRequest:
      x-swagger-router-model: io.swagger.petstore.model.PasswordResetRequest
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        newPassword:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          writeOnly: true

    PasswordResetLinkResponse:
      x-swagger-router-model: io.swagger.petstore.model.PasswordResetLinkResponse
      type: object
      additionalProperties: false
      required: [resetUrl, expiresAt]
      properties:
        resetUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    LoginRequest:
      x-swagger-router-model: io.swagger.petstore.model.LoginRequest
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9_.-]+$'
          example: qa_user
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          writeOnly: true
          example: password123

    LoginResponse:
      x-swagger-router-model: io.swagger.petstore.model.LoginResponse
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          minLength: 20
          description: Подписанный HS256 JWT.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
        token_type:
          type: string
          enum: [Bearer]
          example: Bearer
        expires_in:
          type: integer
          format: int64
          minimum: 1
          maximum: 3600
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    User:
      x-swagger-router-model: io.swagger.petstore.model.User
      type: object
      additionalProperties: false
      required: [id, username, email, userStatus, role]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: b9ec3485-6954-4faf-813b-1c9d25ea750c
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9_.-]+$'
          example: qa_user
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
          example: Test
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
          example: User
        email:
          type: string
          format: email
          maxLength: 254
          example: test@example.com
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          writeOnly: true
        phone:
          type: string
          minLength: 7
          maxLength: 30
          pattern: '^\+?[0-9 ()-]+$'
          nullable: true
          example: '+1-555-0101'
        userStatus:
          $ref: '#/components/schemas/AccountStatus'
        role:
          $ref: '#/components/schemas/Role'

    UserUpdateRequest:
      x-swagger-router-model: io.swagger.petstore.model.UserUpdateRequest
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
        email:
          type: string
          format: email
          maxLength: 254
          nullable: true
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          writeOnly: true
          nullable: true
        phone:
          type: string
          minLength: 7
          maxLength: 30
          pattern: '^\+?[0-9 ()-]+$'
          nullable: true

    Category:
      x-swagger-router-model: io.swagger.petstore.model.Category
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: 0e446653-3b7b-4ad1-81d3-b0a71af26f31
        name:
          type: string
          minLength: 1
          maxLength: 50
          example: Dogs

    Tag:
      x-swagger-router-model: io.swagger.petstore.model.Tag
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
          example: f0c2308f-19f2-4689-a395-7926a5825cd0
        name:
          type: string
          minLength: 1
          maxLength: 30
          pattern: '^[A-Za-z0-9_.-]+$'
          example: friendly

    Pet:
      x-swagger-router-model: io.swagger.petstore.model.Pet
      type: object
      additionalProperties: false
      required: [name]
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          example: 7c1d1b70-f31e-42cd-9f78-6a5d87ed8620
        name:
          type: string
          minLength: 1
          maxLength: 100
          pattern: '.*\S.*'
          example: Luna
        category:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Category'
        photoUrls:
          type: array
          maxItems: 20
          nullable: true
          items:
            type: string
            format: uri
            minLength: 1
            maxLength: 2048
          example:
            - https://example.com/pets/luna.jpg
        tags:
          type: array
          maxItems: 20
          nullable: true
          items:
            $ref: '#/components/schemas/Tag'
        status:
          type: string
          description: Текущий статус питомца в каталоге.
          enum: [available, pending, sold]
          default: available
          example: available

    OrderCreate:
      x-swagger-router-model: io.swagger.petstore.model.Order
      type: object
      additionalProperties: false
      required: [petId, quantity]
      properties:
        petId:
          type: string
          format: uuid
          example: 7c1d1b70-f31e-42cd-9f78-6a5d87ed8620
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          example: 1
        shipDate:
          type: string
          format: date-time
          nullable: true
          example: '2026-09-06T12:00:00Z'
        status:
          type: string
          enum: [placed, approved, delivered]
          default: placed
          example: placed
        complete:
          type: boolean
          default: false
          example: false

    Order:
      x-swagger-router-model: io.swagger.petstore.model.Order
      type: object
      additionalProperties: false
      required: [id, petId, quantity, shipDate, status, complete]
      properties:
        id:
          type: string
