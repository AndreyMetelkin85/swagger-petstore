  /pet/findByStatus:
    get:
      tags: [Pets]
      summary: Поиск питомцев по статусу
      description: |-
        Публичный поиск по каталогу. Передайте один статус или несколько статусов
        через запятую, например `available,pending`. Если совпадений нет, сервер
        возвращает пустой массив `[]` со статусом 200.
      operationId: findPetsByStatus
      x-swagger-router-controller: PetController
      security: []
      parameters:
        - name: status
          in: query
          required: true
          description: Один или несколько статусов жизненного цикла через запятую.
          schema:
            type: string
            minLength: 4
            maxLength: 30
            pattern: '^(available|pending|sold)(,(available|pending|sold))*$'
          examples:
            single:
              value: available
            multiple:
              value: available,pending
      responses:
        '200':
          description: Найденные питомцы; массив может быть пустым.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          description: Обязательный параметр status не передан.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingStatus:
                  value: {status: 400, error: BAD_REQUEST, message: Status is required, details: []}
        '422':
          description: Передано недопустимое значение status.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                invalidStatus:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: status, message: Status must be available, pending or sold}
        '500':
          description: Не удалось выполнить поиск питомцев.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

