                  value: {status: 404, error: USER_NOT_FOUND, message: User was not found, details: []}
        '409':
          description: Пользователь не заблокирован или его статус изменился параллельно.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                invalidStatusTransition:
                  value: {status: 409, error: INVALID_STATUS_TRANSITION, message: The account is not blocked, details: []}
        '500':
          description: Не удалось разблокировать пользователя.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Bearer token из POST /auth/login. Передавайте его в заголовке Authorization: Bearer <access_token>.'

  parameters:
    PetId:
      name: petId
      in: path
      required: true
      description: UUID питомца.
      schema:
        type: string
        format: uuid
      example: 7c1d1b70-f31e-42cd-9f78-6a5d87ed8620
    OrderId:
      name: orderId
      in: path
      required: true
      description: UUID заказа.
      schema:
        type: string
        format: uuid
      example: e3a724f6-580d-4d87-91c4-8f17e2027629
    PaymentId:
      name: paymentId
      in: path
      required: true
      description: UUID платежа.
      schema:
        type: string
        format: uuid
      example: 51c0bd19-792f-4144-a775-87a660c53e37
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID для безопасного повтора запроса оплаты.
      schema:
        type: string
        format: uuid
      example: 12d39e45-5737-4c0a-8878-232793eddb62
    UserId:
      name: userId
      in: path
      required: true
      description: UUID пользователя.
      schema:
        type: string
        format: uuid
      example: b9ec3485-6954-4faf-813b-1c9d25ea750c
    OneTimeCode:
      name: code
      in: query
      required: true
      description: Одноразовый секрет из confirmationUrl или resetUrl.
      schema:
        type: string
        minLength: 32
        maxLength: 128

  schemas:
    Role:
      type: string
      description: Роль авторизации, назначенная пользователю.
      enum: [USER, ADMIN]
      example: USER

    AccountStatus:
      type: string
      description: Состояние учётной записи пользователя.
      enum: [PENDING, ACTIVE, BLOCKED]
      example: ACTIVE

    Address:
      x-swagger-router-model: io.swagger.petstore.model.Address
      type: object
      additionalProperties: false
      required: [city, street, house, postalCode]
      properties:
        city:
          type: string
          minLength: 1
          maxLength: 100
          example: Москва
        street:
          type: string
          minLength: 1
          maxLength: 150
          example: Федорова
        house:
          type: string
          minLength: 1
          maxLength: 30
          example: '30'
        apartment:
          type: string
          minLength: 1
          maxLength: 30
          nullable: true
          example: '12'
        postalCode:
          type: string
          pattern: '^[0-9]{6}$'
          minLength: 6
          maxLength: 6
          example: '123456'

    RegisterRequest:
      x-swagger-router-model: io.swagger.petstore.model.RegisterRequest
      type: object
      additionalProperties: false
      required: [username, password, email]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9_.-]+$'
          example: qa_engineer
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          writeOnly: true
          example: SecurePass123
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          example: qa.engineer@example.com
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
          example: Alex
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
          example: Smith
        phone:
          type: string
          minLength: 7
          maxLength: 30
          pattern: '^\+?[0-9 ()-]+$'
          nullable: true
          example: '+1-555-0110'
        address:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Address'

    RegistrationResponse:
      x-swagger-router-model: io.swagger.petstore.model.RegistrationResponse
      type: object
      additionalProperties: false
      required: [user, confirmationUrl, expiresAt]
      properties:
        user:
          $ref: '#/components/schemas/User'
        confirmationUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    ConfirmationLinkResponse:
      x-swagger-router-model: io.swagger.petstore.model.ConfirmationLinkResponse
      type: object
      additionalProperties: false
      required: [confirmationUrl, expiresAt]
      properties:
        confirmationUrl:
          type: string
          format: uri
        expiresAt:
          type: string
          format: date-time

    PasswordForgotRequest:
      x-swagger-router-model: io.swagger.petstore.model.PasswordForgotRequest
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254

    PasswordResetRequest:
      x-swagger-router-model: io.swagger.petstore.model.PasswordResetRequest
      type: object
      additionalProperties: false
      required: [newPassword]
      properties:
        newPassword:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          writeOnly: true

    PasswordResetLinkResponse:
      x-swagger-router-model: io.swagger.petstore.model.PasswordResetLinkResponse
      type: object
      additionalProperties: false
      required: [expiresAt]
      properties:
        resetUrl:
          type: string
          format: uri
          nullable: true
          description: Доступна только при PETSTORE_EXPOSE_TEST_LINKS=true в изолированном учебном окружении.
        expiresAt:
          type: string
          format: date-time

    LoginRequest:
      x-swagger-router-model: io.swagger.petstore.model.LoginRequest
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
          example: qa.user@example.com
        password:
          type: string
          format: password
          minLength: 6
          maxLength: 100
          writeOnly: true
          example: password123

    LoginResponse:
      x-swagger-router-model: io.swagger.petstore.model.LoginResponse
      type: object
      additionalProperties: false
      required: [access_token, token_type, expires_in, user]
      properties:
        access_token:
          type: string
          minLength: 20
          description: Подписанный HS256 JWT.
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
        token_type:
          type: string
          enum: [Bearer]
          example: Bearer
        expires_in:
          type: integer
          format: int64
          minimum: 1
          maximum: 3600
          example: 3600
        user:
          $ref: '#/components/schemas/User'

    User:
      x-swagger-router-model: io.swagger.petstore.model.User
      type: object
      additionalProperties: false
      required: [id, username, email, userStatus, role, address]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
          example: b9ec3485-6954-4faf-813b-1c9d25ea750c
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9_.-]+$'
          example: qa_user
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
          example: Test
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
          example: User
        email:
          type: string
          format: email
          maxLength: 254
          example: test@example.com
        phone:
          type: string
          minLength: 7
          maxLength: 30
          pattern: '^\+?[0-9 ()-]+$'
          nullable: true
          example: '+1-555-0101'
        address:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Address'
        userStatus:
          $ref: '#/components/schemas/AccountStatus'
        role:
          $ref: '#/components/schemas/Role'

    UserUpdateRequest:
      x-swagger-router-model: io.swagger.petstore.model.UserUpdateRequest
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
        phone:
          type: string
          minLength: 7
          maxLength: 30
          pattern: '^\+?[0-9 ()-]+$'
          nullable: true
        address:
          nullable: true
          description: Передайте null, чтобы удалить текущий адрес целиком.
          allOf:
            - $ref: '#/components/schemas/Address'

    AdminUserUpdateRequest:
      x-swagger-router-model: io.swagger.petstore.model.AdminUserUpdateRequest
      type: object
      additionalProperties: false
      required: [username, firstName, lastName, email, phone, role, address]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9_.-]+$'
        firstName:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
        lastName:
          type: string
          minLength: 1
          maxLength: 50
          nullable: true
        email:
          type: string
          format: email
          minLength: 3
          maxLength: 254
        phone:
          type: string
          minLength: 7
          maxLength: 30
