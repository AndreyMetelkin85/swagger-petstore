openapi: 3.0.4
info:
  title: Локальный API Swagger Petstore
  version: 2.0.0
  description: |-
    Локальный Petstore API на Swagger Inflector, ориентированный на практику
    ручного и автоматизированного API-тестирования. Проект содержит предсказуемые
    тестовые данные, подписанные Bearer-токены, ролевую авторизацию, постоянное
    хранение в PostgreSQL и единый формат ошибок JSON.

    Данные сохраняются после перезапуска API-контейнера в именованном Docker volume.
    Используйте учётную запись `admin` для управления питомцами и пользователями,
    а `user1` — для работы со своим профилем и заказами.
  contact:
    name: Локальный учебный проект
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080/api/v3
    description: Локальный сервер Docker или Maven
tags:
  - name: Состояние
    description: Проверка готовности API и PostgreSQL для Docker и smoke-тестов.
  - name: Авторизация
    description: Публичные операции регистрации и входа.
  - name: Питомцы
    description: Публичный каталог питомцев и управление с ролью ADMIN.
  - name: Заказы
    description: Авторизованные операции с заказами и статистика для ADMIN.
  - name: Пользователи
    description: Управление своим профилем и пользователями с ролью ADMIN.

paths:
  /health:
    get:
      tags: [Состояние]
      summary: Проверить состояние API
      description: Возвращает состояние готовности API и PostgreSQL. Токен доступа не требуется.
      operationId: health
      x-swagger-router-controller: HealthController
      security: []
      responses:
        '200':
          description: API и PostgreSQL готовы принимать запросы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
                service: swagger-petstore
                database: UP
                timestamp: '2026-09-05T09:15:30.000Z'
        '503':
          description: API запущен, но PostgreSQL недоступен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: DOWN
                service: swagger-petstore
                database: DOWN
                timestamp: '2026-09-05T09:15:30.000Z'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/register:
    post:
      tags: [Авторизация]
      summary: Зарегистрировать локального пользователя
      description: |-
        Создаёт новую учётную запись без токена. Новому пользователю всегда
        назначается роль `USER`; создать ADMIN через этот endpoint нельзя.
      operationId: register
      x-swagger-router-controller: AuthController
      security: []
      requestBody:
        required: true
        description: Учётные данные и поля профиля нового пользователя.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              qaEngineer:
                summary: Корректные данные регистрации
                value:
                  username: qa_engineer
                  password: SecurePass123
                  email: qa.engineer@example.com
                  firstName: Alex
                  lastName: Smith
                  phone: '+1-555-0110'
              invalid:
                summary: Данные, приводящие к ответу 422
                value:
                  username: qa
                  password: '123'
                  email: not-an-email
      responses:
        '201':
          description: Учётная запись пользователя создана.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 11
                username: qa_engineer
                email: qa.engineer@example.com
                firstName: Alex
                lastName: Smith
                phone: '+1-555-0110'
                userStatus: 1
                role: USER
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Авторизация]
      summary: Войти и получить токен доступа
      description: |-
        Проверяет локальные учётные данные и возвращает HS256 JWT сроком на один час.
        Передавайте полученное значение в заголовке `Authorization: Bearer <accessToken>`.
      operationId: login
      x-swagger-router-controller: AuthController
      security: []
      requestBody:
        required: true
        description: Имя и пароль зарегистрированного или тестового пользователя.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              user:
                summary: Тестовая учётная запись USER
                value:
                  username: user1
                  password: password123
              admin:
                summary: Тестовая учётная запись ADMIN
                value:
                  username: admin
                  password: admin123
      responses:
        '200':
          description: Аутентификация выполнена успешно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                accessToken: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                tokenType: Bearer
                expiresIn: 3600
                user:
                  id: 2
                  username: user1
                  email: test@example.com
                  firstName: Test
                  lastName: User
                  phone: '+1-555-0101'
                  userStatus: 1
                  role: USER
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pet:
    post:
      tags: [Питомцы]
      summary: Добавить питомца
      description: Создаёт запись в каталоге. Операция доступна только пользователю с ролью ADMIN.
      operationId: addPet
      x-swagger-router-controller: PetController
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Данные нового питомца. Если `id` не передан, сервер создаст его автоматически.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
            examples:
              dog:
                value:
                  name: Luna
                  category:
                    id: 1
                    name: Dogs
                  photoUrls:
                    - https://example.com/pets/luna.jpg
                  tags:
                    - id: 1
                      name: friendly
                  status: available
      responses:
        '201':
          description: Питомец создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Питомцы]
      summary: Полностью обновить питомца
      description: Заменяет данные питомца с указанным в теле `id`. Требуется роль ADMIN.
      operationId: updatePet
      x-swagger-router-controller: PetController
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Полное новое представление питомца. Требуется положительный `id`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pet'
            example:
              id: 4
              name: Dog 1 Updated
              category:
                id: 1
                name: Dogs
              photoUrls: []
              tags: []
              status: pending
      responses:
        '200':
          description: Данные питомца обновлены.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pet/findByStatus:
    get:
      tags: [Питомцы]
      summary: Найти питомцев по статусу
      description: |-
        Публичный поиск по каталогу. Передайте один статус или несколько статусов
        через запятую, например `available,pending`. Если совпадений нет, сервер
        возвращает пустой массив `[]` со статусом 200.
      operationId: findPetsByStatus
      x-swagger-router-controller: PetController
      security: []
      parameters:
        - name: status
          in: query
          required: true
          description: Один или несколько статусов жизненного цикла через запятую.
          schema:
            type: string
            minLength: 4
            maxLength: 30
            pattern: '^(available|pending|sold)(,(available|pending|sold))*$'
          examples:
            single:
              value: available
            multiple:
              value: available,pending
      responses:
        '200':
          description: Найденные питомцы; массив может быть пустым.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pet/findByTags:
    get:
      tags: [Питомцы]
      summary: Найти питомцев по тегам
      description: Публичный поиск питомцев, соответствующих хотя бы одному переданному тегу.
      operationId: findPetsByTags
      x-swagger-router-controller: PetController
      security: []
      parameters:
        - name: tags
          in: query
          required: true
          description: Имена тегов. Для нескольких тегов повторите query-параметр.
          schema:
            type: array
            minItems: 1
            maxItems: 20
            items:
              type: string
              minLength: 1
              maxLength: 30
          style: form
          explode: true
          example: [friendly, vaccinated]
      responses:
        '200':
          description: Найденные питомцы; массив может быть пустым.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /pet/{petId}:
    parameters:
      - $ref: '#/components/parameters/PetId'
    get:
      tags: [Питомцы]
      summary: Получить питомца по идентификатору
      description: Возвращает одну публичную запись питомца из каталога.
      operationId: getPetById
      x-swagger-router-controller: PetController
      security: []
      responses:
        '200':
          description: Питомец найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Питомцы]
      summary: Удалить питомца
      description: Безвозвратно удаляет питомца из PostgreSQL. Требуется роль ADMIN.
      operationId: deletePet
      x-swagger-router-controller: PetController
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Питомец удалён; тело ответа отсутствует.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /store/inventory:
    get:
      tags: [Заказы]
      summary: Получить количество заказов по статусам
      description: Возвращает суммарное количество сохранённых заказов по статусам. Требуется роль ADMIN.
      operationId: getInventory
      x-swagger-router-controller: OrderController
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Количество заказов, сгруппированное по статусу.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                  format: int32
                  minimum: 0
              example:
                placed: 2
                approved: 1
                delivered: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /store/order:
    get:
      tags: [Заказы]
      summary: Получить заказы текущего пользователя
      description: Возвращает только заказы, принадлежащие авторизованному пользователю.
      operationId: listOrders
      x-swagger-router-controller: OrderController
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Заказы текущего пользователя; массив может быть пустым.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Заказы]
      summary: Создать заказ
      description: Создаёт заказ для авторизованного пользователя с ролью USER или ADMIN.
      operationId: placeOrder
      x-swagger-router-controller: OrderController
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Данные заказа. Сервер создаёт `id`; статус по умолчанию — `placed`.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
            examples:
              basicOrder:
                value:
                  petId: 4
                  quantity: 1
                  status: placed
                  complete: false
      responses:
        '201':
          description: Заказ создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /store/order/{orderId}:
    parameters:
      - $ref: '#/components/parameters/OrderId'
    get:
      tags: [Заказы]
      summary: Получить заказ по идентификатору
      description: USER может получить только собственный заказ; ADMIN может получить любой заказ.
      operationId: getOrderById
      x-swagger-router-controller: OrderController
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Заказ найден и доступен текущему пользователю.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Заказы]
      summary: Удалить заказ
      description: Удаляет заказ из PostgreSQL. Требуется роль ADMIN.
      operationId: deleteOrder
      x-swagger-router-controller: OrderController
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Заказ удалён; тело ответа отсутствует.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/me:
    get:
      tags: [Пользователи]
      summary: Получить профиль текущего пользователя
      description: Возвращает профиль пользователя, определённого по Bearer-токену.
      operationId: getCurrentUser
      x-swagger-router-controller: UserController
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Профиль текущего пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags: [Пользователи]
      summary: Обновить профиль текущего пользователя
      description: Обновляет только переданные изменяемые поля; имя пользователя и роль изменить нельзя.
      operationId: updateCurrentUser
      x-swagger-router-controller: UserController
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Изменяемые поля профиля. Необходимо передать хотя бы одно поле.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
            example:
              firstName: Updated
              email: updated.user@example.com
      responses:
        '200':
          description: Обновлённый профиль текущего пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Пользователи]
      summary: Удалить профиль текущего пользователя
      description: Удаляет учётную запись из токена; дальнейшее использование этого токена станет невозможным.
      operationId: deleteCurrentUser
      x-swagger-router-controller: UserController
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Текущая учётная запись удалена; тело ответа отсутствует.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /user/{username}:
    parameters:
      - $ref: '#/components/parameters/Username'
    get:
      tags: [Пользователи]
      summary: Получить пользователя по имени
      description: Возвращает профиль указанного пользователя. Требуется роль ADMIN.
      operationId: getUserByName
      x-swagger-router-controller: UserController
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Пользователь найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Пользователи]
      summary: Удалить пользователя по имени
      description: Удаляет учётную запись из PostgreSQL. Требуется роль ADMIN.
      operationId: deleteUser
      x-swagger-router-controller: UserController
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Пользователь удалён; тело ответа отсутствует.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: HS256 JWT, возвращаемый методом POST /auth/login. Срок действия токена — 3600 секунд.

  parameters:
    PetId:
      name: petId
      in: path
      required: true
      description: UUID питомца.
      schema:
        type: string
        format: uuid
      example: 44444444-4444-4444-8444-444444444444
    OrderId:
      name: orderId
      in: path
      required: true
      description: UUID заказа.
      schema:
        type: string
        format: uuid
      example: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
    Username:
      name: username
      in: path
      required: true
      description: Имя пользователя с учётом регистра.
      schema:
        type: string
        minLength: 3
        maxLength: 30
        pattern: '^[A-Za-z0-9_.-]+$'
      example: user1

  responses:
    BadRequest:
      description: Некорректный синтаксис запроса, path- или query-параметр.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 400
            error: BAD_REQUEST
            message: Pet id must be a valid UUID
            details: []
    Unauthorized:
      description: Bearer-токен отсутствует, имеет неверный формат, недействителен или истёк.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UnauthorizedErrorResponse'
          examples:
            missingToken:
              value:
                status: 401
                error: UNAUTHORIZED
                message: Bearer access token is required
                details: []
            invalidToken:
              value:
                status: 401
                error: INVALID_TOKEN
                message: Access token is invalid
                details: []
            expiredToken:
              value:
                status: 401
                error: TOKEN_EXPIRED
                message: Access token has expired
                details: []
    Forbidden:
      description: Токен действителен, но роли или прав владения недостаточно для операции.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ForbiddenErrorResponse'
          example:
            status: 403
            error: FORBIDDEN
            message: The current role is not allowed to perform this operation
            details: []
    NotFound:
      description: Запрошенная сущность не существует.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFoundErrorResponse'
          example:
            status: 404
            error: PET_NOT_FOUND
            message: Pet was not found
            details: []
    Conflict:
      description: Сущность конфликтует с уже сохранёнными данными.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ConflictErrorResponse'
          example:
            status: 409
            error: USER_ALREADY_EXISTS
            message: A user with this username already exists
            details: []
    ValidationError:
      description: JSON корректен, но одно или несколько значений нарушают бизнес-ограничения.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
          example:
            status: 422
            error: VALIDATION_ERROR
            message: Request validation failed
            details:
              - field: username
                message: Username is required
    InternalServerError:
      description: Непредвиденная ошибка на стороне сервера.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            status: 500
            error: INTERNAL_SERVER_ERROR
            message: An unexpected error occurred
            details: []

