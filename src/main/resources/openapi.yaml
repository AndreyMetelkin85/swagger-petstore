              examples:
                accountNotVerified:
                  value: {status: 403, error: ACCOUNT_NOT_VERIFIED, message: The account has not been confirmed, details: []}
                accountBlocked:
                  value: {status: 403, error: ACCOUNT_BLOCKED, message: The account is blocked, details: []}
        '409':
          description: Email уже принадлежит другому пользователю.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                emailAlreadyExists:
                  value: {status: 409, error: EMAIL_ALREADY_EXISTS, message: A user with this email already exists, details: []}
        '422':
          description: Данные профиля не прошли проверку.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                invalidProfile:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: email, message: Email must be a valid email address}
        '500':
          description: Не удалось обновить профиль.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}
    delete:
      tags: [Users]
      summary: Удаление профиля
      description: Удаляет учётную запись из токена; дальнейшее использование этого токена станет невозможным.
      operationId: deleteCurrentUser
