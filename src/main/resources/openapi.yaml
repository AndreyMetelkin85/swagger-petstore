                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}
    put:
      tags: [Users]
      summary: Обновление пользователя
      description: Полностью обновляет управляемые поля профиля. Операция доступна только администратору; статус изменяется отдельными командами блокировки.
      operationId: updateUserById
      x-swagger-router-controller: UserController
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Полное представление управляемых полей без id и userStatus.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUserUpdateRequest'
            example:
              username: qa_user
              firstName: Alex
              lastName: Smith
              email: qa.user@example.com
              phone: '+1-555-0110'
              role: USER
              address:
                city: Москва
                street: Федорова
                house: '30'
                apartment: '12'
                postalCode: '123456'
      responses:
        '200':
          description: Пользователь обновлён; ранее выданные ему Bearer tokens отозваны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: userId, тело запроса или JSON имеют неверный формат.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                invalidUserId:
                  value: {status: 400, error: BAD_REQUEST, message: User id must be a valid UUID, details: []}
                missingBody:
                  value: {status: 400, error: BAD_REQUEST, message: Request body is required, details: []}
                malformedJson:
                  value: {status: 400, error: BAD_REQUEST, message: Request body contains malformed or incompatible JSON, details: []}
        '401':
          description: Bearer token отсутствует или недействителен.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingToken:
                  value: {status: 401, error: UNAUTHORIZED, message: Bearer token is required, details: []}
                invalidToken:
                  value: {status: 401, error: INVALID_TOKEN, message: Access token is invalid, details: []}
                expiredToken:
                  value: {status: 401, error: TOKEN_EXPIRED, message: Access token has expired, details: []}
        '403':
          description: Операция недоступна для текущей роли или состояния учётной записи.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                roleForbidden:
                  value: {status: 403, error: FORBIDDEN, message: The current role is not allowed to perform this operation, details: []}
                accountBlocked:
                  value: {status: 403, error: ACCOUNT_BLOCKED, message: The account is blocked, details: []}
        '404':
          description: Пользователь с указанным UUID не найден.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                userNotFound:
                  value: {status: 404, error: USER_NOT_FOUND, message: User was not found, details: []}
        '409':
          description: Username или email уже занят либо переход роли запрещён.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                usernameAlreadyExists:
                  value: {status: 409, error: USERNAME_ALREADY_EXISTS, message: A user with this username already exists, details: []}
                emailAlreadyExists:
                  value: {status: 409, error: EMAIL_ALREADY_EXISTS, message: A user with this email already exists, details: []}
                invalidRoleTransition:
                  value: {status: 409, error: INVALID_ROLE_TRANSITION, message: Only an active user can be promoted to administrator, details: []}
                lastAdminProtected:
                  value: {status: 409, error: LAST_ADMIN_PROTECTED, message: The last administrator cannot be demoted, details: []}
        '422':
          description: Поля профиля не прошли валидацию.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                invalidProfile:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: email, message: Email must be a valid email address}
        '500':
          description: Не удалось обновить пользователя.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /admin/users/{userId}/block:
    parameters:
      - $ref: '#/components/parameters/UserId'
    post:
      tags: [Administration]
      summary: Блокировка пользователя
      description: Переводит пользователя в статус BLOCKED и отзывает выданные токены.
      operationId: blockUser
      x-swagger-router-controller: AdminUserController
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Пользователь заблокирован, его старые JWT отозваны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: userId не является корректным UUID.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                invalidUserId:
                  value: {status: 400, error: BAD_REQUEST, message: User id must be a valid UUID, details: []}
        '401':
          description: Bearer token отсутствует или недействителен.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingToken:
                  value: {status: 401, error: UNAUTHORIZED, message: Bearer token is required, details: []}
                invalidToken:
                  value: {status: 401, error: INVALID_TOKEN, message: Access token is invalid, details: []}
                expiredToken:
                  value: {status: 401, error: TOKEN_EXPIRED, message: Access token has expired, details: []}
        '403':
          description: Операция запрещена для текущей или целевой учётной записи.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                roleForbidden:
                  value: {status: 403, error: FORBIDDEN, message: The current role is not allowed to perform this operation, details: []}
                accountNotVerified:
                  value: {status: 403, error: ACCOUNT_NOT_VERIFIED, message: The account has not been confirmed, details: []}
                accountBlocked:
                  value: {status: 403, error: ACCOUNT_BLOCKED, message: The account is blocked, details: []}
                adminAccountProtected:
                  value: {status: 403, error: ADMIN_ACCOUNT_PROTECTED, message: Administrator accounts cannot be managed by this operation, details: []}
        '404':
          description: Пользователь с указанным UUID не найден.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
