openapi: 3.0.4
info:
  title: Swagger Petstore API
  version: 2.1.0
  description: |-
    API зоомагазина: регистрация, каталог питомцев и зоотоваров, фотографии, общая корзина и заказы с единой оплатой.
    Проект предназначен для практики ручного и автоматизированного тестирования на реалистичных сценариях успешной работы и обработки ошибок.
    Для практики доступны два демо-аккаунта: admin (администратор) и user (обычный пользователь).
    Служат для демонстрации ролей и проверки доступа в учебном окружении.
  contact:
    name: Training project
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:8080/api/v3
    description: Local development server
tags:
  - name: Health
    description: Проверка состояния сервиса.
  - name: Registration
    description: Регистрация и подтверждение пользователей.
  - name: Authentication
    description: Аутентификация и восстановление пароля.
  - name: Pets
    description: Операции с питомцами.
  - name: Orders
    description: Операции с заказами.
  - name: Payments
    description: Оплата заказов тестовыми картами.
  - name: Users
    description: Операции с пользователями.
  - name: Administration
    description: Административные операции.

  -
    "name": "Products"
    "description": "Products"
  -
    "name": "Categories"
    "description": "Categories"
  -
    "name": "Pet cards"
    "description": "Pet cards"
  -
    "name": "Media"
    "description": "Media"
  -
    "name": "Cart"
    "description": "Cart"
  -
    "name": "Store orders"
    "description": "Store orders"
  -
    "name": "Store payments"
    "description": "Store payments"
  -
    "name": "Telemetry"
    "description": "Telemetry"
paths:
  /health:
    get:
      tags: [Health]
      summary: Проверка состояния сервиса
      description: Возвращает состояние API и подключения к базе данных.
      operationId: health
      x-swagger-router-controller: HealthController
      security: []
      responses:
        '200':
          description: API и PostgreSQL готовы принимать запросы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: UP
                service: swagger-petstore
                database: UP
                timestamp: '2026-09-05T09:15:30.000Z'
        '503':
          description: API запущен, но PostgreSQL недоступен.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: DOWN
                service: swagger-petstore
                database: DOWN
                timestamp: '2026-09-05T09:15:30.000Z'
        '500':
          description: Не удалось определить состояние сервиса.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                healthCheckFailed:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /auth/register:
    post:
      tags: [Registration]
      summary: Регистрация пользователя
      description: Создаёт пользователя в статусе PENDING и возвращает ссылку подтверждения.
      operationId: register
      x-swagger-router-controller: RegistrationController
      security: []
      requestBody:
        required: true
        description: Учётные данные и поля профиля нового пользователя.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            examples:
              qaEngineer:
                summary: Корректные данные регистрации
                value:
                  username: qa_engineer
                  password: SecurePass123
                  email: qa.engineer@example.com
                  firstName: Alex
                  lastName: Smith
                  phone: '+1-555-0110'
                  address:
                    city: Москва
                    street: Федорова
                    house: '30'
                    apartment: '12'
                    postalCode: '123456'
              invalid:
                summary: Данные, приводящие к ответу 422
                value:
                  username: qa
                  password: '123'
                  email: not-an-email
      responses:
        '201':
          description: Учётная запись со статусом PENDING создана; возвращена ссылка подтверждения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
              example:
                user:
                  id: b9ec3485-6954-4faf-813b-1c9d25ea750c
                  username: qa_engineer
                  email: qa.engineer@example.com
                  firstName: Alex
                  lastName: Smith
                  phone: '+1-555-0110'
                  address:
                    city: Москва
                    street: Федорова
                    house: '30'
                    apartment: '12'
                    postalCode: '123456'
                  userStatus: PENDING
                  role: USER
                confirmationUrl: http://localhost:8080/api/v3/auth/confirm/b9ec3485-6954-4faf-813b-1c9d25ea750c?code=example
                expiresAt: '2026-09-06T12:00:00Z'
        '400':
          description: Тело запроса отсутствует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingBody:
                  value: {status: 400, error: BAD_REQUEST, message: Request body is required, details: []}
        '409':
          description: Имя пользователя или email уже зарегистрированы; details указывает конфликтующие поля без их значений.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userAlreadyExists:
                  value: {status: 409, error: USER_ALREADY_EXISTS, message: A user with this username or email already exists, details: [{field: username, message: A user with this username already exists}, {field: email, message: A user with this email already exists}]}
                usernameAlreadyExists:
                  value: {status: 409, error: USER_ALREADY_EXISTS, message: A user with this username or email already exists, details: [{field: username, message: A user with this username already exists}]}
                emailAlreadyExists:
                  value: {status: 409, error: USER_ALREADY_EXISTS, message: A user with this username or email already exists, details: [{field: email, message: A user with this email already exists}]}
        '422':
          description: Поля регистрации не прошли валидацию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidRegistration:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: email, message: Email must be a valid email address}
        '500':
          description: Не удалось создать пользователя.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /auth/confirm/{userId}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Registration]
      summary: Подтверждение регистрации
      description: Подтверждает регистрацию по идентификатору пользователя и одноразовому коду.
      operationId: confirm
      x-swagger-router-controller: RegistrationController
      security: []
      parameters:
        - $ref: '#/components/parameters/OneTimeCode'
      responses:
        '200':
          description: Регистрация подтверждена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: UUID или одноразовый код имеют неверный формат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidUserId:
                  value: {status: 400, error: BAD_REQUEST, message: User id must be a valid UUID, details: []}
                invalidConfirmationLink:
                  value: {status: 400, error: INVALID_CONFIRMATION_LINK, message: The one-time link is invalid, details: []}
        '404':
          description: Пользователь из ссылки не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  value: {status: 404, error: USER_NOT_FOUND, message: User was not found, details: []}
        '409':
          description: Регистрация уже подтверждена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyConfirmed:
                  value: {status: 409, error: ACCOUNT_ALREADY_CONFIRMED, message: The account has already been confirmed, details: []}
        '410':
          description: Срок действия ссылки подтверждения истёк.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                confirmationExpired:
                  value: {status: 410, error: CONFIRMATION_LINK_EXPIRED, message: The one-time link has expired, details: []}
        '500':
          description: Не удалось подтвердить регистрацию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /auth/confirmation/resend:
    post:
      tags: [Registration]
      summary: Повторная отправка ссылки подтверждения
      description: Аннулирует текущую ссылку подтверждения и возвращает новую.
      operationId: resendConfirmation
      x-swagger-router-controller: RegistrationController
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Старая ссылка аннулирована, создана новая.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationLinkResponse'
        '400':
          description: Тело запроса отсутствует.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingBody:
                  value: {status: 400, error: BAD_REQUEST, message: Request body is required, details: []}
        '401':
          description: Email или пароль указаны неверно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  value: {status: 401, error: INVALID_CREDENTIALS, message: Email or password is incorrect, details: []}
        '429':
          description: Слишком много неверных попыток аутентификации.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                rateLimited:
                  value: {status: 429, error: LOGIN_RATE_LIMITED, message: Too many failed login attempts. Try again in 5 minute(s), details: []}
        '409':
          description: Учётная запись уже подтверждена.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                alreadyConfirmed:
                  value: {status: 409, error: ACCOUNT_ALREADY_CONFIRMED, message: The account has already been confirmed, details: []}
        '422':
          description: Email или пароль не переданы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingCredentials:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: email, message: Email is required}
        '500':
          description: Не удалось создать новую ссылку подтверждения.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /auth/password/forgot:
    post:
      tags: [Authentication]
      summary: Запрос восстановления пароля
      description: Создаёт запрос на сброс пароля для пользователя с указанным email.
      operationId: forgotPassword
      x-swagger-router-controller: AuthenticationController
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordForgotRequest'
      responses:
        '200':
          description: Запрос создан и действует 30 минут.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordResetLinkResponse'
        '400':
          description: Тело запроса отсутствует.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingBody:
                  value: {status: 400, error: BAD_REQUEST, message: Request body is required, details: []}
        '404':
          description: Пользователь с указанным email не найден.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                userNotFound:
                  value: {status: 404, error: USER_NOT_FOUND, message: A user with this email was not found, details: []}
        '422':
          description: Email не передан или имеет неверный формат.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidEmail:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: email, message: Email must be a valid email address}
        '500':
          description: Не удалось создать ссылку восстановления.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /auth/password/reset:
    post:
      tags: [Authentication]
      summary: Сброс пароля
      description: Устанавливает новый пароль по одноразовому коду восстановления.
      operationId: resetPassword
      x-swagger-router-controller: AuthenticationController
      security: []
      parameters:
        - $ref: '#/components/parameters/OneTimeCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Пароль изменён, ранее выданные JWT отозваны.
        '400':
          description: Одноразовый код недействителен или тело запроса отсутствует.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingBody:
                  value: {status: 400, error: BAD_REQUEST, message: Request body is required, details: []}
                invalidResetLink:
                  value: {status: 400, error: INVALID_RESET_LINK, message: The one-time link is invalid, details: []}
        '409':
          description: Ссылка уже использована или её состояние изменилось.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                linkAlreadyUsed:
                  value: {status: 409, error: RESET_LINK_ALREADY_USED, message: The password reset link has already been used, details: []}
                stateChanged:
                  value: {status: 409, error: RESET_STATE_CHANGED, message: The password reset state changed; request a new link, details: []}
        '410':
          description: Срок действия ссылки восстановления истёк.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                resetExpired:
                  value: {status: 410, error: RESET_LINK_EXPIRED, message: The one-time link has expired, details: []}
        '422':
          description: Новый пароль не прошёл валидацию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidPassword:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: newPassword, message: Password must be between 6 and 100 characters}
        '500':
          description: Не удалось изменить пароль.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /auth/login:
    post:
      tags: [Authentication]
      summary: Авторизация пользователя
      description: Проверяет учётные данные и возвращает Bearer token.
      operationId: login
      x-swagger-router-controller: AuthenticationController
      security: []
      requestBody:
        required: true
        description: Email и пароль.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              user:
                summary: Пользователь
                value:
                  email: qa.user@example.com
                  password: SecurePass123
              admin:
                summary: Администратор
                value:
                  email: admin@example.com
                  password: admin123
      responses:
        '200':
          description: Аутентификация выполнена успешно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example.signature
                token_type: Bearer
                expires_in: 3600
                user:
                  id: b9ec3485-6954-4faf-813b-1c9d25ea750c
                  username: qa_user
                  email: qa.user@example.com
                  firstName: Alex
                  lastName: Smith
                  phone: '+1-555-0101'
                  userStatus: ACTIVE
                  role: USER
        '400':
          description: Тело запроса отсутствует.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingBody:
                  value: {status: 400, error: BAD_REQUEST, message: Request body is required, details: []}
        '401':
          description: Email или пароль указаны неверно.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidCredentials:
                  value: {status: 401, error: INVALID_CREDENTIALS, message: Email or password is incorrect, details: []}
        '429':
          description: Слишком много неверных попыток входа.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                tooManyAttempts:
                  value: {status: 429, error: LOGIN_RATE_LIMITED, message: Too many failed login attempts. Try again in 5 minute(s), details: []}
        '403':
          description: Состояние учётной записи запрещает авторизацию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notVerified:
                  value: {status: 403, error: ACCOUNT_NOT_VERIFIED, message: The account has not been confirmed, details: []}
                blocked:
                  value: {status: 403, error: ACCOUNT_BLOCKED, message: The account is blocked, details: []}
        '422':
          description: Email или пароль не переданы.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                missingCredentials:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: password, message: Password is required}
        '500':
          description: Не удалось выполнить авторизацию.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /pet:
    post:
      tags: [Pets]
      summary: Добавление питомца
      description: Создаёт запись питомца в каталоге.
      operationId: addPet
      x-swagger-router-controller: PetController
      security:
        - bearerAuth: []
      requestBody:
        required: true
        description: Данные нового питомца. Идентификатор создаётся сервером.
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetCreateRequest'
            examples:
              dog:
                value:
                  name: Luna
                  category:
                    id: 0e446653-3b7b-4ad1-81d3-b0a71af26f31
                    name: Dogs
                  photoUrls:
                    - https://example.com/pets/luna.jpg
                  tags:
                    - id: f0c2308f-19f2-4689-a395-7926a5825cd0
                      name: friendly
                  status: available
                  price: 15000.00
      responses:
        '201':
          description: Питомец создан.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
        '400':
          description: Тело запроса отсутствует.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingBody:
                  value: {status: 400, error: BAD_REQUEST, message: Request body is required, details: []}
        '401':
          description: Bearer token отсутствует или недействителен.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                missingToken:
                  value: {status: 401, error: UNAUTHORIZED, message: Bearer token is required, details: []}
                invalidToken:
                  value: {status: 401, error: INVALID_TOKEN, message: Access token is invalid, details: []}
                expiredToken:
                  value: {status: 401, error: TOKEN_EXPIRED, message: Access token has expired, details: []}
        '403':
          description: У пользователя нет роли ADMIN.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                roleForbidden:
                  value: {status: 403, error: FORBIDDEN, message: The current role is not allowed to perform this operation, details: []}
                accountBlocked:
                  value: {status: 403, error: ACCOUNT_BLOCKED, message: The account is blocked, details: []}
        '422':
          description: Поля питомца не прошли валидацию.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                invalidPet:
                  value:
                    status: 422
                    error: VALIDATION_ERROR
                    message: Request validation failed
                    details:
                      - {field: name, message: Pet name is required}
        '500':
          description: Не удалось создать питомца.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
                internalError:
                  value: {status: 500, error: INTERNAL_SERVER_ERROR, message: An unexpected error occurred, details: []}

  /pet/findByStatus:
    get:
      tags: [Pets]
      summary: Поиск питомцев по статусу
      description: Возвращает список питомцев с указанными статусами.
      operationId: findPetsByStatus
      x-swagger-router-controller: PetController
      security: []
      parameters:
        - name: status
          in: query
          required: true
          description: Один или несколько статусов жизненного цикла через запятую.
          schema:
            type: string
            minLength: 4
            maxLength: 30
            pattern: '^(available|pending|reserved|sold)(,(available|pending|reserved|sold))*$'
          examples:
            single:
              value: available
            multiple:
              value: available,pending
      responses:
        '200':
          description: Найденные питомцы; массив может быть пустым.
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  $ref: '#/components/schemas/Pet'
        '400':
          description: Обязательный параметр status не передан.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
              examples:
