services:
  petstore:
    image: ${PETSTORE_IMAGE:-andymentor/swagger-petstore}:${PETSTORE_IMAGE_TAG:-latest}
    pull_policy: always
    container_name: swagger-petstore
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petstore}
      POSTGRES_USER: ${POSTGRES_USER:-petstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petstore}
      PETSTORE_TOKEN_SECRET: ${PETSTORE_TOKEN_SECRET:-}
      PETSTORE_PUBLIC_BASE_URL: ${PETSTORE_PUBLIC_BASE_URL:-http://localhost:8080/api/v3}
      PETSTORE_EXPOSE_TEST_LINKS: ${PETSTORE_EXPOSE_TEST_LINKS:-true}
      PETSTORE_SMTP_HOST: ${PETSTORE_SMTP_HOST:-}
      PETSTORE_SMTP_PORT: ${PETSTORE_SMTP_PORT:-25}
      PETSTORE_SMTP_FROM: ${PETSTORE_SMTP_FROM:-noreply@petstore.test}
      PETSTORE_SMTP_TIMEOUT: ${PETSTORE_SMTP_TIMEOUT:-5}
      PETSTORE_MAIL_FRONTEND_URL: ${PETSTORE_MAIL_FRONTEND_URL:-}
      PETSTORE_MEDIA_ROOT: /var/lib/petstore/media
    volumes:
      - petstore-data:/var/lib/postgresql/data
      - petstore-media:/var/lib/petstore/media
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/v3/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      start_period: 120s
      retries: 12

volumes:
  petstore-data:
    name: ${PETSTORE_DB_VOLUME:-swagger-petstore-db-data}
  petstore-media:
    name: ${PETSTORE_MEDIA_VOLUME:-swagger-petstore-media-data}
