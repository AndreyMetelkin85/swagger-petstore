services:
  postgres:
    build:
      context: ./docker/postgres
      dockerfile: Dockerfile
    image: swagger-petstore-db:local
    container_name: swagger-petstore-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petstore}
      POSTGRES_USER: ${POSTGRES_USER:-petstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petstore}
    volumes:
      - petstore-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10

  petstore:
    build:
      context: .
      dockerfile: Dockerfile
    image: swagger-petstore:local
    container_name: swagger-petstore
    environment:
      PETSTORE_TOKEN_SECRET: ${PETSTORE_TOKEN_SECRET:-}
      PETSTORE_PUBLIC_BASE_URL: ${PETSTORE_PUBLIC_BASE_URL:-http://localhost:8080/api/v3}
      PETSTORE_EXPOSE_TEST_LINKS: ${PETSTORE_EXPOSE_TEST_LINKS:-false}
      PETSTORE_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-petstore}
      PETSTORE_DB_USER: ${POSTGRES_USER:-petstore}
      PETSTORE_DB_PASSWORD: ${POSTGRES_PASSWORD:-petstore}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/v3/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 5

volumes:
  petstore-db-data:
    name: ${PETSTORE_DB_VOLUME:-swagger-petstore-db-data}
