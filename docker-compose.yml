# Общий запуск готовых образов; исходники фронтенда находятся в lapki-frontend.
x-api-image: &api-image ${PETSTORE_IMAGE:-andymentor/swagger-petstore}:${PETSTORE_IMAGE_TAG:-latest}
x-database: &database
  PETSTORE_DB_URL: postgresql://postgres:5432/${POSTGRES_DB:-petstore}
  PETSTORE_DB_USER: ${POSTGRES_USER:-petstore}
  PETSTORE_DB_PASSWORD: ${POSTGRES_PASSWORD:-petstore}

services:
  postgres:
    image: postgres:16.15-bookworm@sha256:bb3e1a57e5407e0a5280b4211980a5e537f4abd234a87014ac979849a78dd825
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-petstore}
      POSTGRES_USER: ${POSTGRES_USER:-petstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-petstore}
    command: [postgres, -c, log_min_error_statement=panic, -c, log_error_verbosity=terse]
    volumes:
      - petstore-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrations:
    image: *api-image
    entrypoint: [/opt/flyway/flyway]
    command: [-locations=filesystem:/app/resources/db/migration, -baselineOnMigrate=true, -baselineVersion=1, migrate]
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-petstore}
      FLYWAY_USER: ${POSTGRES_USER:-petstore}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:-petstore}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    image: *api-image
    environment:
      <<: *database
      PETSTORE_TOKEN_SECRET: ${PETSTORE_TOKEN_SECRET:?Укажите существующий или новый секрет в .env}
      PETSTORE_PUBLIC_BASE_URL: http://localhost:${FRONTEND_PORT:-8090}/api/v3
      PETSTORE_EXPOSE_TEST_LINKS: ${PETSTORE_EXPOSE_TEST_LINKS:-true}
      PETSTORE_SMTP_HOST: mail
      PETSTORE_SMTP_PORT: "2525"
      PETSTORE_SMTP_FROM: ${PETSTORE_SMTP_FROM:-noreply@petstore.test}
      PETSTORE_SMTP_TIMEOUT: ${PETSTORE_SMTP_TIMEOUT:-5}
      PETSTORE_MAIL_FRONTEND_URL: http://localhost:${FRONTEND_PORT:-8090}
      PETSTORE_MEDIA_ROOT: /var/lib/petstore/media
      PETSTORE_DEMO_CATALOG: ${PETSTORE_DEMO_CATALOG:-true}
    volumes:
      - petstore-media:/var/lib/petstore/media
    ports:
      - "127.0.0.1:${PETSTORE_API_PORT:-8080}:8080"
    depends_on:
      migrations:
        condition: service_completed_successfully
      mail:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: ${FRONTEND_IMAGE:-andymentor/lapki-frontend:latest}
    environment:
      LAPKI_MAIL_UI_URL: http://localhost:${PETSTORE_MAIL_HTTP_PORT:-8025}
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8090}:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  mail:
    image: ${PETSTORE_MAIL_IMAGE:-andymentor/swagger-petstore-mail:latest}
    environment:
      ServerOptions__Urls: http://0.0.0.0:8025
      ServerOptions__Port: "2525"
      ServerOptions__ImapPort: "1143"
      ServerOptions__HostName: mail.petstore.test
      ServerOptions__TlsMode: None
      ServerOptions__DisableIPv6: "true"
      ServerOptions__AuthenticationRequired: "false"
      ServerOptions__WebAuthenticationRequired: "false"
      ServerOptions__DeliverMessagesToUsersDefaultMailbox: "false"
      ServerOptions__NumberOfMessagesToKeep: "500"
      ServerOptions__Mailboxes__0__Name: User1
      ServerOptions__Mailboxes__0__Recipients: user1@petstore.test
      ServerOptions__Mailboxes__1__Name: User2
      ServerOptions__Mailboxes__1__Recipients: user2@petstore.test
      ServerOptions__Mailboxes__2__Name: Tests
      ServerOptions__Mailboxes__2__Recipients: "*"
      ServerOptions__Users__0__Username: user1
      ServerOptions__Users__0__Password: mail-test-only
      ServerOptions__Users__0__DefaultMailbox: User1
      ServerOptions__Users__1__Username: user2
      ServerOptions__Users__1__Password: mail-test-only
      ServerOptions__Users__1__DefaultMailbox: User2
      ServerOptions__Users__2__Username: tests
      ServerOptions__Users__2__Password: mail-test-only
      ServerOptions__Users__2__DefaultMailbox: Tests
      RelayOptions__SmtpServer: ""
      RelayOptions__AutomaticRelayExpression: ""
      Serilog__MinimumLevel__Default: Warning
    volumes:
      - mail-data:/smtp4dev
    ports:
      - "127.0.0.1:${PETSTORE_MAIL_HTTP_PORT:-8025}:8025"
      - "127.0.0.1:${PETSTORE_MAIL_SMTP_PORT:-2525}:2525"
      - "127.0.0.1:${PETSTORE_MAIL_IMAP_PORT:-1143}:1143"
    restart: unless-stopped

volumes:
  petstore-data:
    name: ${PETSTORE_DB_VOLUME:-swagger-petstore-db-data}
  petstore-media:
    name: ${PETSTORE_MEDIA_VOLUME:-swagger-petstore-media-data}
  mail-data:
    name: ${PETSTORE_MAIL_VOLUME:-swagger-petstore-mail-data}
