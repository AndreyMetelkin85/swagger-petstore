name: Build one native candidate
on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      runner:
        type: string
        required: true
    outputs:
      candidate_digest:
        value: ${{ jobs.build.outputs.candidate_digest }}
      mail_digest:
        value: ${{ jobs.build.outputs.mail_digest }}
permissions:
  contents: read
jobs:
  build:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 12
    outputs:
      candidate_digest: ${{ steps.image.outputs.digest }}
      mail_digest: ${{ steps.mail.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v4
        if: inputs.arch == 'arm64'
        with:
          platforms: amd64
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Daily security epoch and isolated branch cache
        id: cache
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
          case "$BRANCH" in master|dev) branch="$BRANCH" ;; *) branch="run-${{ github.run_id }}" ;; esac
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
      - name: Build each candidate exactly once
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          pull: true
          push: true
          platforms: linux/${{ inputs.arch }}
          tags: ${{ vars.DOCKERHUB_USERNAME }}/swagger-petstore:candidate-${{ github.sha }}-${{ github.run_id }}-${{ inputs.arch }}
          build-args: SECURITY_UPDATE_EPOCH=${{ steps.cache.outputs.day }}
          cache-from: |
            type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/swagger-petstore:buildcache-${{ steps.cache.outputs.branch }}-${{ inputs.arch }}
            type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/swagger-petstore:buildcache-master-${{ inputs.arch }}
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/swagger-petstore:buildcache-${{ steps.cache.outputs.branch }}-${{ inputs.arch }},mode=max
          sbom: true
          provenance: mode=max
          labels: org.opencontainers.image.revision=${{ github.sha }}
      - name: Load and check the exact candidate architecture
        env:
          CANDIDATE: ${{ vars.DOCKERHUB_USERNAME }}/swagger-petstore@${{ steps.image.outputs.digest }}
          ARCH: ${{ inputs.arch }}
        run: |
          docker pull "$CANDIDATE"
          test "$(docker image inspect --format '{{.Architecture}}' "$CANDIDATE")" = "$ARCH"
      - name: Build the separate mail candidate
        id: mail
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile.mail
          pull: true
          push: true
          platforms: linux/${{ inputs.arch }}
          tags: ${{ vars.DOCKERHUB_USERNAME }}/swagger-petstore-mail:candidate-${{ github.sha }}-${{ github.run_id }}-${{ inputs.arch }}
          build-args: SECURITY_UPDATE_EPOCH=${{ steps.cache.outputs.day }}
          cache-from: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/swagger-petstore-mail:buildcache-${{ steps.cache.outputs.branch }}-${{ inputs.arch }}
          cache-to: type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/swagger-petstore-mail:buildcache-${{ steps.cache.outputs.branch }}-${{ inputs.arch }},mode=max
          sbom: true
          provenance: mode=max
          labels: org.opencontainers.image.revision=${{ github.sha }}
