name: Verify one immutable candidate
on:
  workflow_call:
    inputs:
      arch:
        type: string
        required: true
      runner:
        type: string
        required: true
      digest:
        type: string
        required: true
      mail_digest:
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Load exactly the built digest
        env:
          DIGEST: ${{ inputs.digest }}
          REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}/swagger-petstore
          MAIL_DIGEST: ${{ inputs.mail_digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "$REPOSITORY@$DIGEST"
          docker tag "$REPOSITORY@$DIGEST" swagger-petstore:ci
          docker tag "$REPOSITORY@$DIGEST" swagger-petstore-python:preview
          docker pull "${REPOSITORY}-mail@$MAIL_DIGEST"
          docker tag "${REPOSITORY}-mail@$MAIL_DIGEST" swagger-petstore-mail:preview
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-runtime.txt
      - name: Install contract dependencies
        run: python -m pip install --constraint requirements-runtime.txt -e '.[test]'
      - name: Contracts and persistence on the target architecture
        env:
          BASE_URL: http://127.0.0.1:8081/api/v3
          PETSTORE_COMMERCE_CONTAINER: petstore-python-preview
          PETSTORE_COMMERCE_DB_CONTAINER: petstore-python-db
        run: |
          docker compose -f tests/docker-compose.yml up -d --no-build --wait --wait-timeout 180
          python -m pytest tests/smoke tests/system/test_commerce_system.py -q -o addopts=''
      - name: Scanner cache epoch
        id: epoch
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Restore writable scanner databases
        id: scanner-cache
        uses: actions/cache@v4
        with:
          path: .trivy-cache
          key: trivy-v2-${{ runner.os }}-${{ inputs.arch }}-0.74.0-${{ steps.epoch.outputs.day }}
          restore-keys: trivy-v2-${{ runner.os }}-${{ inputs.arch }}-0.74.0-
      - name: Scan exact candidate with runner-owned cache
        run: |
          mkdir -p .trivy-cache
          test -w .trivy-cache
          docker save --output candidate-image.tar swagger-petstore:ci
          docker run --rm --user "$(id -u):$(id -g)" --mount type=bind,source="$PWD/candidate-image.tar",target=/image.tar,readonly --mount type=bind,source="$PWD/.trivy-cache",target=/cache aquasec/trivy:0.74.0 --cache-dir /cache image --input /image.tar --timeout 10m --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --scanners vuln --no-progress
          test -r .trivy-cache/db/metadata.json
          test -r .trivy-cache/java-db/metadata.json
          docker save --output mail-image.tar swagger-petstore-mail:preview
          docker run --rm --user "$(id -u):$(id -g)" --mount type=bind,source="$PWD/mail-image.tar",target=/image.tar,readonly --mount type=bind,source="$PWD/.trivy-cache",target=/cache aquasec/trivy:0.74.0 --cache-dir /cache image --input /image.tar --timeout 10m --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --scanners vuln --no-progress
          echo "Trivy cache restored: ${{ steps.scanner-cache.outputs.cache-hit }}; databases readable by runner" >> "$GITHUB_STEP_SUMMARY"
      - name: Remove own architecture test container
        if: always()
        run: |
          docker compose -f tests/docker-compose.yml logs --tail=40 || true
          docker compose -f tests/docker-compose.yml down --volumes
