name: Docker build and security scan

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev", "master"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build application image
        run: docker build --pull --tag swagger-petstore:ci .
      - name: Scan application image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0 image
          --exit-code 1
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --scanners vuln
          --no-progress
          swagger-petstore:ci
