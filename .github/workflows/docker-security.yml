name: Docker build and security scan

on:
  push:
    branches: ["dev"]
  pull_request:
    branches: ["dev", "master"]

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build application image
        run: docker build --pull --tag swagger-petstore:ci .
      - name: Build database image
        run: docker build --pull --tag swagger-petstore-db:ci docker/postgres
      - name: Build all-in-one image
        run: docker build --pull --file Dockerfile.all-in-one --tag swagger-petstore:all-in-one-ci .
      - name: Scan application image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0 image
          --exit-code 1
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --scanners vuln
          --no-progress
          swagger-petstore:ci
      - name: Scan database image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0 image
          --exit-code 1
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --scanners vuln
          --no-progress
          swagger-petstore-db:ci
      - name: Scan all-in-one image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0 image
          --exit-code 1
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --scanners vuln
          --no-progress
          swagger-petstore:all-in-one-ci
