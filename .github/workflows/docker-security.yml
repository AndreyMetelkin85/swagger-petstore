name: Docker build and security scan

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

permissions:
  contents: read
  actions: read

concurrency:
  group: store-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
      runtime: ${{ steps.scope.outputs.runtime }}
      build: ${{ steps.scope.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare with the last verified production release
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python docker/ci_changes.py

  quality:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-runtime.txt
      - name: Install quality dependencies
        run: python -m pip install --constraint requirements-runtime.txt -e '.[test,quality]'
      - name: Ruff and strict types
        run: |
          ruff check src tests docker
          ruff format --check src tests docker
          pyright
      - name: Verify the offline data package on the fast path
        if: needs.changes.outputs.backend != 'true'
        run: python -m pytest tests/unit -n 4 --dist loadscope -q

  build-amd64:
    needs: changes
    if: needs.changes.outputs.build == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/build-platform.yml
    secrets: inherit
    with:
      arch: amd64
      runner: ubuntu-24.04

  verify-amd64:
    needs: build-amd64
    uses: ./.github/workflows/verify-platform.yml
    with:
      arch: amd64
      runner: ubuntu-24.04
      digest: ${{ needs.build-amd64.outputs.candidate_digest }}
      mail_digest: ${{ needs.build-amd64.outputs.mail_digest }}

  build-arm64:
    needs: changes
    if: needs.changes.outputs.build == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/build-platform.yml
    secrets: inherit
    with:
      arch: arm64
      runner: ubuntu-24.04-arm

  verify-arm64:
    needs: build-arm64
    uses: ./.github/workflows/verify-platform.yml
    with:
      arch: arm64
      runner: ubuntu-24.04-arm
      digest: ${{ needs.build-arm64.outputs.candidate_digest }}
      mail_digest: ${{ needs.build-arm64.outputs.mail_digest }}

  python-verification:
    needs: [changes, build-amd64]
    if: needs.changes.outputs.backend == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/python.yml
    with:
      mode: regression
      candidate: true
      digest: ${{ needs.build-amd64.outputs.candidate_digest }}
      mail_digest: ${{ needs.build-amd64.outputs.mail_digest }}

  swagger:
    needs: [changes, build-amd64]
    if: needs.changes.outputs.backend == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/python.yml
    with:
      mode: swagger
      candidate: true
      digest: ${{ needs.build-amd64.outputs.candidate_digest }}
      mail_digest: ${{ needs.build-amd64.outputs.mail_digest }}

  runtime:
    needs: [changes, build-amd64]
    if: needs.changes.outputs.build == 'true' && github.event_name != 'pull_request'
    uses: ./.github/workflows/python.yml
    with:
      mode: runtime
      candidate: true
      digest: ${{ needs.build-amd64.outputs.candidate_digest }}
      mail_digest: ${{ needs.build-amd64.outputs.mail_digest }}
      backend: ${{ needs.changes.outputs.backend == 'true' }}

  pull-request:
    needs: changes
    if: needs.changes.outputs.build == 'true' && github.event_name == 'pull_request'
    uses: ./.github/workflows/python.yml
    with:
      mode: all
      backend: true

  publish:
    needs: [changes, quality, build-amd64, build-arm64, verify-amd64, verify-arm64, python-verification, swagger, runtime]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.changes.result == 'success' && needs.changes.outputs.runtime == 'true' && needs.quality.result == 'success' && needs.build-amd64.result == 'success' && needs.build-arm64.result == 'success' && needs.verify-amd64.result == 'success' && needs.verify-arm64.result == 'success' && needs.runtime.result == 'success' && ((needs.changes.outputs.backend == 'true' && needs.python-verification.result == 'success' && needs.swagger.result == 'success') || (needs.changes.outputs.backend == 'false' && needs.python-verification.result == 'skipped' && needs.swagger.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Verify this commit is still the current master
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api repos/${{ github.repository }}/git/ref/heads/master --jq .object.sha)" = '${{ github.sha }}'
      - name: Promote tested digests, without another build
        env:
          REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}/swagger-petstore
          AMD64: ${{ needs.build-amd64.outputs.candidate_digest }}
          ARM64: ${{ needs.build-arm64.outputs.candidate_digest }}
          MAIL_AMD64: ${{ needs.build-amd64.outputs.mail_digest }}
          MAIL_ARM64: ${{ needs.build-arm64.outputs.mail_digest }}
        run: |
          docker buildx imagetools create --tag "$REPOSITORY:sha-${{ github.sha }}" --tag "$REPOSITORY:latest" "$REPOSITORY@$AMD64" "$REPOSITORY@$ARM64"
          docker buildx imagetools inspect "$REPOSITORY:latest"
          docker buildx imagetools create --tag "${REPOSITORY}-mail:sha-${{ github.sha }}" --tag "${REPOSITORY}-mail:latest" "${REPOSITORY}-mail@$MAIL_AMD64" "${REPOSITORY}-mail@$MAIL_ARM64"
          docker buildx imagetools inspect "${REPOSITORY}-mail:latest"
          echo "Published only verified AMD64 and ARM64 digests without rebuilding" >> "$GITHUB_STEP_SUMMARY"

  timing:
    needs: [changes, quality, build-amd64, build-arm64, verify-amd64, verify-arm64, python-verification, swagger, runtime, pull-request, publish]
    if: always() && needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Report queue, build, cache, test and promotion times
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python docker/ci_timings.py
