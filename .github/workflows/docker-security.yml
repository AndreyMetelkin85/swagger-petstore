name: Docker build and security scan

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["dev", "master"]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Build application image
        run: docker build --pull --tag swagger-petstore:ci .
      - name: Set up Python for API smoke tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install smoke test dependencies
        run: python -m pip install -r tests/smoke/requirements.txt
      - name: Test isolated application before publication
        run: |
          docker run --detach --name petstore-ci --publish 127.0.0.1:8080:8080 swagger-petstore:ci
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/api/v3/health; then break; fi
            sleep 2
          done
          curl --fail http://localhost:8080/api/v3/health
          python -m pytest -q tests/smoke
      - name: Remove isolated test application
        if: always()
        run: |
          docker logs petstore-ci || true
          docker rm --force --volumes petstore-ci || true
      - name: Scan application image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy:0.74.0 image
          --exit-code 1
          --severity CRITICAL,HIGH
          --ignore-unfixed
          --scanners vuln
          --no-progress
          swagger-petstore:ci

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and publish multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          pull: true
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ vars.DOCKERHUB_USERNAME }}/swagger-petstore:latest
          sbom: true
          provenance: mode=max
          labels: |
            org.opencontainers.image.title=Swagger Petstore API
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
