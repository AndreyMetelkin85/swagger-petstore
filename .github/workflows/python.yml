name: Python checks

on:
  push:
    branches: ["feature/python-fastapi-migration", "feature/store-commerce", "feature/fastapi-native-refactor", "feature/shop-full-cycle", "dev"]
  workflow_call:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-runtime.txt
      - name: Install Python and test dependencies
        run: python -m pip install --constraint requirements-runtime.txt -e '.[test,quality]'
      - name: Ruff
        run: |
          ruff check src tests docker
          ruff format --check src tests docker
      - name: Pyright strict
        run: pyright
      - name: Unit tests
        run: python -m pytest tests/unit -q
      - name: Set up Node for the bundled frontend
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Check frontend sources
        working-directory: ui
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
      - name: Build isolated candidate image
        run: docker compose -f tests/docker-compose.yml build
      - name: Start isolated candidate
        run: docker compose -f tests/docker-compose.yml up -d --wait --wait-timeout 180
      - name: Create a dedicated integration database and run original Flyway migrations
        run: |
          docker exec petstore-python-preview psql -U petstore -d petstore -c 'CREATE DATABASE petstore_python_test'
          docker exec -e FLYWAY_URL=jdbc:postgresql://127.0.0.1:5432/petstore_python_test -e FLYWAY_USER=petstore -e FLYWAY_PASSWORD=petstore petstore-python-preview /opt/flyway/flyway -locations=filesystem:/app/resources/db/migration migrate
      - name: Unit and PostgreSQL integration tests with coverage gate
        env:
          PETSTORE_TEST_DB_URL: postgresql://127.0.0.1:5433/petstore_python_test
        run: python -m pytest tests/unit tests/integration -q --cov=petstore --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      - name: Existing system contract tests without changing expectations
        env:
          BASE_URL: http://127.0.0.1:8081/api/v3
        run: python -m pytest tests/smoke -q -o addopts=''
      - name: Install browser
        run: python -m playwright install --with-deps chromium
      - name: Swagger, email and restart system tests
        env:
          PETSTORE_UI_URL: http://127.0.0.1:8081
          PETSTORE_RESTART_CONTAINER: petstore-python-preview
          PETSTORE_MAIL_UI_URL: http://127.0.0.1:8025
          PETSTORE_MAIL_RESTART_CONTAINER: petstore-python-preview
          PETSTORE_TEST_UPGRADE_IMAGE: swagger-petstore-python:preview
          PETSTORE_COMMERCE_CONTAINER: petstore-python-preview
          PETSTORE_UNIFIED_CONTAINER: petstore-python-preview
          PETSTORE_STORE_UI_URL: http://127.0.0.1:8091
          BASE_URL: http://127.0.0.1:8081/api/v3
        run: python -m pytest tests/system -q
      - name: Test frontend, API and mail inside one container
        env:
          LAPKI_PREVIEW_URL: http://127.0.0.1:8090
          LAPKI_MAIL_URL: http://127.0.0.1:8025
          LAPKI_BROWSER_CHANNEL: chrome
        run: |
          docker compose -f tests/docker-compose.yml down
          docker run --detach --name petstore-unified-ci --publish 127.0.0.1:8090:8090 --publish 127.0.0.1:8025:8025 --env PETSTORE_PUBLIC_BASE_URL=http://127.0.0.1:8090/api/v3 --env PETSTORE_MAIL_FRONTEND_URL=http://127.0.0.1:8090 swagger-petstore-python:preview
          for attempt in $(seq 1 90); do
            if docker inspect --format '{{.State.Health.Status}}' petstore-unified-ci | grep -q '^healthy$'; then break; fi
            sleep 2
          done
          cd ui
          npm run test:api
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
      - name: Candidate diagnostics
        if: failure()
        run: docker compose -f tests/docker-compose.yml logs --tail=100
      - name: Remove only the isolated CI candidate
        if: always()
        run: |
          docker rm --force --volumes petstore-unified-ci || true
          docker compose -f tests/docker-compose.yml down --volumes
