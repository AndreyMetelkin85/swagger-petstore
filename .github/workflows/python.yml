name: Python checks

on:
  workflow_call:
    inputs:
      mode:
        type: string
        default: all
      backend:
        type: boolean
        default: true
      digest:
        type: string
        default: ''
      mail_digest:
        type: string
        default: ''
      candidate:
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-runtime.txt
      - name: Install test dependencies
        run: python -m pip install --constraint requirements-runtime.txt -e '.[test]'
      - name: Install PR quality dependencies
        if: ${{ !inputs.candidate }}
        run: python -m pip install --constraint requirements-runtime.txt -e '.[quality]'
      - name: Load the immutable candidate
        if: inputs.candidate
        env:
          DIGEST: ${{ inputs.digest }}
          REPOSITORY: ${{ vars.DOCKERHUB_USERNAME }}/swagger-petstore
          MAIL_DIGEST: ${{ inputs.mail_digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "$REPOSITORY@$DIGEST"
          docker tag "$REPOSITORY@$DIGEST" swagger-petstore-python:preview
          [[ "$MAIL_DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          docker pull "${REPOSITORY}-mail@$MAIL_DIGEST"
          docker tag "${REPOSITORY}-mail@$MAIL_DIGEST" swagger-petstore-mail:preview
      - uses: docker/setup-buildx-action@v4
        if: ${{ !inputs.candidate }}
      - name: Daily security cache epoch
        if: ${{ !inputs.candidate }}
        id: epoch
        run: echo "day=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - name: Build a cached PR candidate
        if: ${{ !inputs.candidate }}
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: swagger-petstore-python:preview
          build-args: SECURITY_UPDATE_EPOCH=${{ steps.epoch.outputs.day }}
          cache-from: |
            type=registry,ref=${{ vars.DOCKERHUB_USERNAME }}/swagger-petstore:buildcache-master-amd64
            type=gha,scope=store-pr-amd64
          cache-to: type=gha,scope=store-pr-amd64,mode=max
      - name: Scan PR candidate without registry credentials
        if: ${{ !inputs.candidate }}
        run: |
          docker save --output pr-candidate.tar swagger-petstore-python:preview
          docker run --rm --mount type=bind,source="$PWD/pr-candidate.tar",target=/image.tar,readonly aquasec/trivy:0.74.0 image --input /image.tar --timeout 10m --exit-code 1 --severity CRITICAL,HIGH --ignore-unfixed --scanners vuln --no-progress
      - name: Build isolated mail for PR
        if: ${{ !inputs.candidate }}
        run: docker build -f docker/Dockerfile.mail -t swagger-petstore-mail:preview .
      - name: Check PR sources
        if: ${{ !inputs.candidate }}
        run: |
          ruff check src tests docker
          ruff format --check src tests docker
          pyright
      - name: Start the isolated application without rebuilding
        run: docker compose -f tests/docker-compose.yml up -d --no-build --wait --wait-timeout 180
      - name: Prepare one database per parallel worker
        if: inputs.mode == 'regression' || inputs.mode == 'all'
        run: python docker/ci_databases.py --container petstore-python-preview --workers 4
      - name: Unit and integration tests once, parallel and isolated
        if: inputs.mode == 'regression' || inputs.mode == 'all'
        env:
          PETSTORE_TEST_DB_URL: postgresql://127.0.0.1:5433/petstore_python_test
        run: python -m pytest tests/unit tests/integration -n 4 --dist loadscope -q --durations=20 --cov=petstore --cov-report=xml --cov-report=term-missing --cov-fail-under=90
      - name: Use the runner's existing Chrome
        if: inputs.mode != 'regression'
        run: echo "PLAYWRIGHT_CHROMIUM_EXECUTABLE=$(command -v google-chrome)" >> "$GITHUB_ENV"
      - name: System contracts, Swagger, mail and persistence
        if: (inputs.mode == 'runtime' || inputs.mode == 'all') && inputs.backend
        env:
          PETSTORE_UI_URL: http://127.0.0.1:8081
          PETSTORE_RESTART_CONTAINER: petstore-python-preview
          PETSTORE_MAIL_UI_URL: http://127.0.0.1:8025
          PETSTORE_MAIL_RESTART_CONTAINER: petstore-mail
          PETSTORE_TEST_UPGRADE_IMAGE: swagger-petstore-python:preview
          PETSTORE_COMMERCE_CONTAINER: petstore-python-preview
          PETSTORE_COMMERCE_DB_CONTAINER: petstore-python-db
          BASE_URL: http://127.0.0.1:8081/api/v3
        run: |
          python -m pytest tests/smoke -q -o addopts=''
          if [ '${{ inputs.candidate }}' = 'true' ]; then
            python -m pytest tests/system -q --ignore=tests/system/test_commerce_system.py --ignore=tests/system/test_swagger_ui.py --durations=20
          else
            python -m pytest tests/system -q --durations=20
          fi
      - name: Every Swagger operation with a single browser
        if: inputs.mode == 'swagger'
        env:
          PETSTORE_UI_URL: http://127.0.0.1:8081
        run: python -m pytest tests/system/test_swagger_ui.py -q --durations=20
      - name: Upload coverage and timing
        if: always() && (inputs.mode == 'regression' || inputs.mode == 'all')
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: coverage.xml
      - name: Diagnostics
        if: failure()
        run: |
          docker compose -f tests/docker-compose.yml logs --tail=80
      - name: Remove only the isolated candidates
        if: always()
        run: |
          docker compose -f tests/docker-compose.yml down --volumes
