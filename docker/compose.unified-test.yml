name: lapki-unified-review
services:
  petstore:
    image: andymentor/swagger-petstore:unified-local
    pull_policy: never
    container_name: lapki-unified-review
    environment:
      POSTGRES_DB: petstore
      POSTGRES_USER: petstore
      POSTGRES_PASSWORD: petstore
      PETSTORE_TOKEN_SECRET: lapki-isolated-unified-review-not-production-2026
      PETSTORE_PUBLIC_BASE_URL: http://127.0.0.1:8089/api/v3
      PETSTORE_MAIL_FRONTEND_URL: http://127.0.0.1:8089
      PETSTORE_EXPOSE_TEST_LINKS: "true"
      PETSTORE_MEDIA_ROOT: /var/lib/petstore/media
    ports:
      - "127.0.0.1:8089:8090"
      - "127.0.0.1:18081:8080"
      - "127.0.0.1:18025:8025"
    volumes:
      - review-db:/var/lib/postgresql/data
      - review-media:/var/lib/petstore/media
      - review-mail:/smtp4dev
volumes:
  review-db:
    name: lapki-unified-review-db
  review-media:
    name: lapki-unified-review-media
  review-mail:
    name: lapki-unified-review-mail
