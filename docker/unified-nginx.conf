user petstore;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 512; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format safe '$request_id $request_method $uri $status $request_time';
    access_log /dev/stdout safe;
    sendfile on;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    server {
        listen 8090;
        root /app/frontend;
        index index.html;
        client_max_body_size 12m;
        add_header X-Content-Type-Options nosniff always;
        location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }
        location /api/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $http_x_request_id;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }
        location /assets/ { add_header Cache-Control 'public, max-age=31536000, immutable'; try_files $uri =404; }
        location = /mockServiceWorker.js { add_header Cache-Control 'no-store'; try_files $uri =404; }
        location / { add_header Cache-Control 'no-cache'; try_files $uri $uri/ /index.html; }
    }
}
