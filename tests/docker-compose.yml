name: petstore-python-preview

services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: swagger-petstore-python:preview
    container_name: petstore-python-preview
    environment:
      PETSTORE_PUBLIC_BASE_URL: http://localhost:8081/api/v3
      PETSTORE_EXPOSE_TEST_LINKS: "true"
      PETSTORE_SMTP_HOST: 127.0.0.1
      PETSTORE_SMTP_PORT: "2525"
      PETSTORE_SMTP_FROM: noreply@petstore.test
    ports:
      - "127.0.0.1:8081:8080"
      - "127.0.0.1:5433:5432"
      - "127.0.0.1:8091:8090"
      - "127.0.0.1:${PETSTORE_PREVIEW_MAIL_HTTP_PORT:-8025}:8025"
      - "127.0.0.1:${PETSTORE_PREVIEW_MAIL_SMTP_PORT:-2525}:2525"
      - "127.0.0.1:${PETSTORE_PREVIEW_MAIL_IMAP_PORT:-1143}:1143"
    volumes:
      - python-preview-data:/var/lib/postgresql/data
      - python-preview-media:/var/lib/petstore/media
      - mail-data:/smtp4dev
    restart: unless-stopped


volumes:
  python-preview-media:
    name: ${PETSTORE_PREVIEW_MEDIA_VOLUME:-petstore-python-preview-media-data}
  python-preview-data:
    name: ${PETSTORE_PREVIEW_DB_VOLUME:-petstore-python-preview-data}
  mail-data:
    name: ${PETSTORE_PREVIEW_MAIL_VOLUME:-petstore-mail-data}
